<div class="task-card">
  <!-- Datum-Badge (optional) -->
  <div class="card-badge" *ngIf="task.dueDate">
    <img src="assets/icons/time.svg" alt="time icon" />
    <span class="badge-date">{{ task.dueDate }}</span>
  </div>

  <!-- Titel und Beschreibung -->
  <h4 class="card-title">{{ task.title }}</h4>
  <p class="card-description" *ngIf="task.description">{{ task.description }}</p>

  <!-- Status + Prozentanzeige -->
  <div class="card-status-row">
    <!-- Beispiel: Zeige alle Labels an -->
    <span class="card-status" *ngFor="let label of task.labels">
      {{ label }}
    </span>
    <!-- Fortschritts-Prozent, wenn vorhanden -->
    <span class="card-percent" *ngIf="task.progress !== undefined">
      {{ task.progress }}%
    </span>
  </div>

  <!-- Fortschrittsbalken (nur anzeigen, wenn task.progress existiert) -->
  <div class="card-progress-bar" *ngIf="task.progress !== undefined">
    <!-- Die Breite richtet sich nach dem Wert von task.progress -->
    <div class="card-progress" [style.width.%]="task.progress"></div>
  </div>

  <!-- Footer mit Comments, Assignees -->
  <div class="card-footer">
    <div class="meta">
      <div class="comments" *ngIf="task.comments !== undefined">
        <!-- <img class="icon" src="assets/img/icons/comments.svg" alt="Comments" /> -->
        <span>{{ task.comments }} Comments</span>
      </div>
    </div>
    <div class="avatar-group" *ngIf="task.assignees?.length">
      <img
        class="avatar"
        *ngFor="let avatar of task.assignees"
        [src]="avatar"
        alt="User Avatar"
      />
    </div>
  </div>
</div>
