<div class="project-board">
  <!-- Header mit Titel, Board-Erstellung und Board-Infos -->
  <header class="board-header">
    <div class="header-top">
      <div class="board-selector">
        <label for="boardSelect">Board:</label>
        <select id="boardSelect" (change)="onBoardSelect($event)">
          <option *ngFor="let board of boards" [value]="board.id" [selected]="board.id === selectedBoardId()">
            {{ board.name }}
          </option>
        </select>
      </div>
      <button class="create-board-btn" [routerLink]="['/create-board']">+ New Board</button>
    </div>

    <div class="header-bottom">
      <div class="board-info">
        <div class="team-info">
          <h2>Design Team</h2>
          <p>Created <span>Feb 23, 2024</span></p>
        </div>
        <div class="privacy-status">
          <span class="privacy-tag">Private</span>
        </div>
        <button class="add-member-btn">Add New Member</button>
      </div>
    </div>
  </header>

  <!-- Kanban-Board -->
  <main class="kanban-board">
    <!-- To Do Column -->
    <section class="kanban-column"
  (dragover)="allowDrop($event)"
  (drop)="onDrop($event, 'To Do')">
      <div class="column-header"><h3>To Do</h3></div>
      <ng-container *ngFor="let task of toDo()">
        <app-task-card [task]="task"></app-task-card>
      </ng-container>
      <button class="add-new-card" (click)="openTaskDialog = true">Add new</button>
    </section>

    <!-- In Progress Column -->
    <section class="kanban-column"
  (dragover)="allowDrop($event)"
  (drop)="onDrop($event, 'In Progress')">
      <div class="column-header"><h3>In Progress</h3></div>
      <ng-container *ngFor="let task of inProgress()">
        <app-task-card [task]="task"></app-task-card>
      </ng-container>
      <button class="add-new-card" (click)="openTaskDialog = true">Add new</button>
    </section>

    <!-- Wait for Feedback Column -->
    <section class="kanban-column"
  (dragover)="allowDrop($event)"
  (drop)="onDrop($event, 'Wait for Feedback')">
      <div class="column-header"><h3>Wait for Feedback</h3></div>
      <ng-container *ngFor="let task of waitForFeedback()">
        <app-task-card
        [task]="task"
        draggable="true"
        (dragstart)="onDragStart($event, task)">
      </app-task-card>
      </ng-container>
      <button class="add-new-card" (click)="openTaskDialog = true">Add new</button>
    </section>

    <!-- Done Column -->
    <section class="kanban-column"
  (dragover)="allowDrop($event)"
  (drop)="onDrop($event, 'Done')">
      <div class="column-header"><h3>Done</h3></div>
      <ng-container *ngFor="let task of done()">
        <app-task-card
  [task]="task"
  draggable="true"
  (dragstart)="onDragStart($event, task)">
</app-task-card>
      </ng-container>
      <button class="add-new-card" (click)="openTaskDialog = true">Add new</button>
    </section>
  </main>

  <!-- Optionaler Board Creator -->
  <app-board-create *ngIf="openCreateBoard"></app-board-create>
</div>

<!-- Task-Dialog -->
<app-create-task-dialog
  *ngIf="openTaskDialog"
  [boardId]="selectedBoardId()"
  (taskCreated)="onTaskCreated($event)"
  (closeDialog)="openTaskDialog = false">
</app-create-task-dialog>
