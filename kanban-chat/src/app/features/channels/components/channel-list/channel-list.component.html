<div class="channel-list">
  <button class="newChannel"(click)="openCreateChannel()">
    <img src="assets/icons/newChat.svg">
    <span class="name">New Channel</span>
</button>
  <div *ngIf="loading$ | async" class="loading">
    Loading channels...
  </div>
  <div *ngIf="error$ | async as error" class="error">
    {{ error }}
  </div>
  <ul>
    <li *ngFor="let channel of channels$ | async" (click)="onChannelClick(channel)">
      <div class="channel-item">
        <strong>{{ channel.name }}</strong>
        <p>{{ channel.description }}</p>
      </div>
    </li>
  </ul>
</div>


<app-create-channel *ngIf="isCreateChannelOpen" (channelCreated)="reloadChannels()"></app-create-channel>
