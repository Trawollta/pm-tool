<div class="overlay">
    <div class="modal">
      <h2>Create New Channel</h2>
  
      <form (submit)="createChannel()">
        <label for="name">Channel Name:</label>
        <input id="name" name="channelName" type="text" placeholder="Name" [(ngModel)]="channelName" required />

  
        <label for="description">Description:</label>
        <input id="description" name="channelDescription" type="text" placeholder="Description" [(ngModel)]="channelDescription" />

  
        <label for="users">Select Users:</label>
        <select id="users" name="selectedUsers" multiple [(ngModel)]="selectedUsers">
            <option *ngFor="let user of users$ | async" [value]="user.id">
              {{ user.name }}
            </option>
          </select>
          
  
        <div class="actions">
          <button type="submit">Create</button>
          <button type="button" (click)="closeOverlay()">Cancel</button>
        </div>
      </form>
    </div>
  </div>
